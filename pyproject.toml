[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cdml"
version = "0.1.0"
description = "Commercial-break fade detection for video, and the chapter marking built on it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Avinante", email = "andrewavinante@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
]

[project.scripts]
cdml = "cdml.cli:main"

[tool.poetry]
packages = [{ include = "cdml" }]

[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
# Training pulls in plotting and progress reporting but inference does not.
matplotlib = ">=3.7"
tqdm = ">=4.66"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
coverage = ">=7.0"
ruff = ">=0.8"
