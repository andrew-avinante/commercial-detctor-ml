[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdml"
version = "0.1.0"
description = "Commercial-break fade detection for video, and the chapter marking built on it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Avinante", email = "andrewavinante@gmail.com" }]

# Inference only. Decoding is done by shelling out to ffmpeg/ffprobe, which are
# system binaries rather than wheels, so they cannot be declared here -- see
# `cdml.features` for why that pipeline replaced OpenCV and librosa.
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
]

[project.optional-dependencies]
# Training pulls in the plotting and progress stack that inference has no use
# for. Kept out of the default install so a consumer that only ever calls
# `infer`/`mark_chapters` -- chapter-inserter, for one -- does not ship them.
train = [
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.scripts]
cdml-infer = "cdml.infer:main"
cdml-mark-chapters = "cdml.mark_chapters:main"

# Only the package is installable. The scripts at the repo root (crop.py,
# graph.py, prune.py, ...) are one-off research tools that import nothing from
# each other, and `legacy/` is the superseded pipeline kept for reference.
[tool.setuptools]
packages = ["cdml"]
